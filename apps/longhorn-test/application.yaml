apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/muthappamk1/k3s-cluster
    targetRevision: HEAD
    path: apps/longhorn-test
    directory:
      include: "longhorn-test.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-test
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
