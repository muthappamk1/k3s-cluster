apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.7.0
    helm:
      values: |
        defaultSettings:
          defaultReplicaCount: 2
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 256Mi
        ingress:
          enabled: true
          ingressClassName: traefik
          host: longhorn.local
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
