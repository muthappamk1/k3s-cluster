apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-remediation
rules:
  # Read node status to detect NotReady nodes
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]

  # List and force-delete stuck Terminating pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]

  # List and delete VolumeAttachments locked to dead nodes
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "delete"]
